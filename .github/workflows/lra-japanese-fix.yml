name: Apply natural Japanese to LRA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lra-japanese-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite LRA customer-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/lra/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '>ABOUT<': '>LRAとは<',
            '>METHOD<': '>進め方<',
            '>PRICE<': '>料金<',
            'OBSERVE THE STRUCTURE OF LIFE.': '暮らしのつながりを見つめる。',
            'いま起きていることのつながりを捉え、何を守り、どこから変えるかを整理します。': 'いま起きていることのつながりを整理し、何を守り、どこから変えるとよいかを考えやすくします。',
            '現在<br>NOW': '現在',
            '原因<br>CAUSE': '原因',
            '維持<br>LOOP': '続く理由',
            '次の一手<br>LEVER': '次の一手',
            'LRA / LIFE REVIEW ASSESSMENT': 'LRA｜ライフレビューアセスメント',
            '生活の中で起きている事実、判断、環境、感情、回復の関係を観測し、原因・維持要因・保護すべきもの・介入候補を構造として整理します。最終的に何を選ぶかは利用者自身が決めます。': '生活の中で起きていることと、判断・環境・感情・休息がどうつながっているかを確認し、原因、続いている理由、守りたいもの、変え方の候補を整理します。最終的に何を選ぶかは、利用者自身が決めます。',
            'FROM OBSERVATION TO DECISION.': '確認して、つないで、判断する。',
            '<b>CORE SCAN</b><p>生活全体を広く捉える。</p>': '<b>全体を確認</b><p>まず、生活全体を広く確認します。</p>',
            '<b>ADAPTIVE SCAN</b><p>回答に応じて必要なところだけ深く見る。</p>': '<b>必要なところを詳しく確認</b><p>回答に応じて、必要なところだけ詳しく確認します。</p>',
            '<b>EVENT TRACE</b><p>実際に起きた出来事の前後関係を追う。</p>': '<b>出来事の流れを整理</b><p>実際に起きた出来事を、前後の流れに沿って整理します。</p>',
            '<b>STRUCTURE ANALYSIS</b><p>CHAIN / LOOP、仮説、反証、レバレッジを整理する。</p>': '<b>全体のつながりを整理</b><p>何が影響し合い、何が繰り返され、どこから変えると動きやすいかを整理します。</p>',
            'OUTPUT / STRUCTURE.': '結果について',
            '答えではなく、<br>判断できる構造を返す。': '答えを決めるのではなく、<br>判断しやすい形に整理する。',
            '現在の構造、最大ボトルネック、主要仮説、根拠と反証、保護対象、レバレッジ、介入候補、不確実性を整理します。': '今の状況、つまずきの中心、考えられる理由、その根拠と当てはまらない点、守りたいもの、使える支え、変え始める場所、まだ分からないことを整理します。',
            '現在の生活構造': '今の状況と全体のつながり',
            'CHAIN / LOOP': '原因のつながりと繰り返し',
            '主要仮説・根拠・反証': '考えられる理由とその根拠',
            '保護対象・資源': '守りたいものと使える支え',
            'レバレッジ・優先介入': 'どこから変えるかと優先順位',
            'DECISION SUPPORT FOR REAL LIFE.': '毎日の判断を、整理された形に。',
            '>PLAN ↗<': '>プランを見る ↗<',
            '>TERMS<': '>利用規約<',
            '>PRIVACY<': '>プライバシー<',
            '>LEGAL<': '>特商法表記<',
            'PRICE / PLAN.': '料金・プラン',
            '<small>FREE</small>': '<small>無料</small>',
            '<small>LIGHT</small>': '<small>ライト</small>',
            '<small>STANDARD</small>': '<small>標準</small>',
            '<small>DEEP</small>': '<small>詳細</small>',
            '<small>CONTINUOUS</small>': '<small>継続</small>',
            'CORE SCAN中心。LRAの基本的な観測・現在地整理を体験する入口。': 'まずLRAの考え方を体験したい方向けです。基本的な質問に答えながら、今の状況を簡単に整理します。',
            '現在地整理。今の状況を簡潔に整理し、主要な構造を把握する。': '今の状況を短時間で整理したい方向けです。生活全体を見渡し、特に影響が大きい部分を確認します。',
            'CORE SCAN＋ADAPTIVE SCAN＋必要時EVENT TRACE。原因・維持要因・ボトルネック、CHAIN / LOOP、複数仮説、反証、不確実性、介入候補まで扱う。': '基本的な質問に加え、回答に応じて必要な質問を追加します。必要に応じて出来事の流れも確認し、原因や続いている理由、つまずきの中心、考えられる理由、まだ分からない点、変え方の候補まで整理します。',
            '詳細構造分析。複数仮説・反証を深め、保護対象／資源、レバレッジ、介入優先順位、追加観測提案まで扱う。': '状況をより詳しく整理したい方向けです。複数の見方を比べながら、守りたいもの、使える支え、どこから変えると動きやすいか、何を優先するか、追加で確認したいことまで整理します。',
            '初回分析＋14日間の変化追跡＋再分析＋PERSONAL BASELINE更新。': '初回の整理に加えて14日間の変化を追い、もう一度見直します。変化の傾向を踏まえて、あなた自身の基準も更新します。',
            'START LRA.': 'LRAを始める',
            '<small>PLAN</small>': '<small>プラン</small>',
            '<small>PRICE</small>': '<small>料金</small>',
            '<span>CORE SCAN</span>': '<span>基本確認</span>',
            'CORE SCAN COMPLETE.': '最初の確認が終わりました。',
            '基本回答を保存しました。': '回答を保存しました。',
            'TERMS.': '利用規約',
            'PRIVACY.': 'プライバシーポリシー',
            'LEGAL.': '特定商取引法に基づく表記',
            'LRAは、利用者の状況を観測・整理し、意思決定を支援するサービスです。診断、治療、法律判断、金融助言その他の専門家業務を行うものではありません。': 'LRAは、利用者の状況を整理し、これからどうするかを考えるための材料を提供するサービスです。医療上の診断や治療、法律上の判断、金融に関する専門的な助言など、専門家の業務を代わりに行うものではありません。',
            'LRAが提示する内容は意思決定の参考情報です。最終的な判断および行動は利用者自身が行います。': 'LRAが示す内容は、考えるための参考情報です。最終的に何を選び、どう行動するかは利用者自身が決めます。',
            '回答内容や観測可能な情報には限界があるため、分析結果には不確実性が含まれます。': '回答内容や確認できる情報には限りがあるため、結果には、まだ分からない点や確かめきれない部分が含まれます。',
            '生命、身体、安全に関する緊急性が疑われる場合には、通常分析より適切な専門機関への接続を優先します。': '命や身体の安全に関わる可能性がある場合は、通常の整理よりも、適切な専門機関への相談を優先します。',
            '申込情報、回答内容、利用履歴、問い合わせ内容、決済に必要な情報等を、サービス提供に必要な範囲で取得します。': '申込時に入力された情報、回答内容、利用履歴、問い合わせ内容、決済に必要な情報などを、サービスの提供に必要な範囲で取得します。',
            'LRAの提供、本人確認、料金請求、問い合わせ対応、安全管理、サービス改善、法令上必要な対応のために利用します。': 'LRAの提供、本人確認、料金の請求、問い合わせへの対応、安全管理、サービスの改善、法令上必要な対応のために利用します。',
            '法令に基づく場合その他正当な理由がある場合を除き、本人の同意なく第三者に提供しません。': '法令に基づく場合など正当な理由がある場合を除き、本人の同意なく第三者に提供しません。',
            '不正アクセス、漏えい、滅失、毀損等を防ぐため、合理的な安全管理措置を講じます。': '不正アクセスや情報の漏えい、紛失、破損などを防ぐため、必要な安全管理を行います。',
            '正式な販売開始前に事業者情報を確定情報へ更新します。現在は決済受付を開始しません。': '正式な販売を始める前に、事業者情報を確定した内容へ更新します。現在は決済を受け付けていません。',
            'インターネット接続料金・通信料金等は利用者負担です。': 'インターネット接続料や通信料などは、利用者の負担となります。',
            '正式な販売開始時に申込画面へ表示します。': '正式な販売を始める際に、申込画面へ表示します。',
            '正式な販売開始時に利用規約および申込画面へ表示します。': '正式な販売を始める際に、利用規約と申込画面へ表示します。',
            "['JUDGMENT',": "['判断',",
            "['ACTION',": "['行動',",
            "['ENVIRONMENT',": "['環境',",
            "['EMOTION',": "['感情',",
            "['RECOVERY',": "['回復',",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit rewritten copy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lra/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Use natural Japanese across LRA public UI'
            git push
          fi
